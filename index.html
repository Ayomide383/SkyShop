<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Basic SEO -->
    <title>SkyShop — Quality Products, Best Prices</title>

    <meta
      name="description"
      content="Shop quality products at great prices on SkyShop. Discover electronics, fashion, home essentials, beauty products, sports gear, and more."
    />

    <meta name="theme-color" content="#0ea5e9" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-        32x32.png" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Canonical URL -->
    <link
      rel="canonical"
      href="https://sky-shop-two.vercel.app/"
    />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />

    <meta
      property="og:title"
      content="SkyShop — Quality Products, Best Prices"
    />

    <meta
      property="og:description"
      content="Discover quality products at great prices on SkyShop. Shop electronics, fashion, home essentials, beauty, sports, and more."
    />

    <meta
      property="og:url"
      content="https://sky-shop-two.vercel.app/"
    />

    <meta
      property="og:site_name"
      content="SkyShop"
    />

    <meta
      property="og:locale"
      content="en_US"
    />

    <!-- Add og:image when the image is created -->
    <meta
      property="og:image"
      content="https://sky-shop-two.vercel.app/og-image.png"
    />

    <meta
      property="og:image:width"
      content="1200"
    />

    <meta
      property="og:image:height"
      content="630"
    />

    <meta
      property="og:image:alt"
      content="SkyShop — Quality Products, Best Prices"
    />

    <!-- Twitter / X -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="SkyShop — Quality Products, Best Prices"
    />

    <meta
      name="twitter:description"
      content="Discover quality products at great prices on SkyShop."
    />

    <meta
      name="twitter:image"
      content="https://sky-shop-two.vercel.app/og-image.png"
    />
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
